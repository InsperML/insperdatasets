[project]
name = "insperdatasets"
version = "0.1.0"
description = "Datasets for the InsperML group"
readme = "README.md"
authors = [
    { name = "Tiago Tavares", email = "tiagoft@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "arxiv>=2.3.1",
    "datasets>=4.4.1",
    "huggingface-hub>=0.33.5",
    "ipykernel>=7.1.0",
    "pytest>=9.0.1",
    "scikit-learn>=1.7.2",
    "soundfile>=0.13.1",
    "toml>=0.10.2",
    "torch>=2.11",
    "torchaudio>=2.11.0",
]

[tool.ruff.format]
quote-style = "single"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
